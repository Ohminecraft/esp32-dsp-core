; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
		;esp32
		;esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32
framework = arduino
extra_scripts = pre:scripts/build_webui.py
board_build.f_cpu = 240000000L
monitor_speed = 115200
build_flags = 
	-DCORE_DEBUG_LEVEL=2
	-O3
	-funroll-loops
	-fstrict-aliasing
	-Wall
	-Wno-unused-variable
	-Wno-unused-function
	-DCONFIG_I2S_SUPPRESS_DEPRECATE_WARN=1
	-DCONFIG_ADC_SUPPRESS_DEPRECATE_WARN=1
	-DCONFIG_DAC_SUPPRESS_DEPRECATE_WARN=1
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	-DCONFIG_ASYNC_TCP_USE_WDT=0
	-DCONFIG_ASYNC_TCP_PRIORITY=10
	-DWS_MAX_QUEUED_MESSAGES=512
	-DUSER_SETUP_LOADED
	-DST7789_DRIVER
	-DTFT_CS=10
	-DTFT_DC=9
	-DTFT_RST=46
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTOUCH_CS=-1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_RGB_ORDER=0 ;BGR
	-DUSE_HSPI_PORT
	-DTFT_INVERSION_OFF
	-DSMOOTH_FONT
	-DLOAD_GFXFF
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
lib_deps = 
	mathieucarbou/ESPAsyncWebServer @ ^3.3.6
	mathieucarbou/AsyncTCP @ ^3.2.14
	bblanchon/ArduinoJson @ ^7.0.4
	bodmer/TFT_eSPI@^2.5.43
	mathertel/RotaryEncoder @1.5.3
	robtillaart/INA226@^0.6.6
monitor_filters =
    esp32_exception_decoder

[env:esp32s3]
board = esp32-s3-devkitc1-n16r8

[env:esp32]
board = esp32dev
board_build.partitions = esp32newpartition.csv
